<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARSTOONS — Registro</title>
  <link rel="stylesheet" href="Style/style.css">
  <style>
    .auth-wrap {
      max-width: 460px;
      margin: 2rem auto;
    }
    .auth-card {
      background: var(--dark2);
      border: 1px solid var(--border);
      border-top: 3px solid var(--red);
      border-radius: 10px;
      padding: 2.5rem 2rem;
    }
    .auth-card h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: .3rem;
    }
    .auth-card h2::after { display: none; }
    .auth-subtitle {
      text-align: center;
      color: var(--gray);
      font-size: .88rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.3rem; }
    .form-group label {
      display: block;
      font-size: .75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: .4rem;
    }
    .form-group input {
      width: 100%;
      background: var(--dark);
      border: 1px solid var(--border);
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      padding: .75rem 1rem;
      border-radius: 4px;
      outline: none;
      transition: .2s;
    }
    .form-group input:focus {
      border-color: var(--red);
      box-shadow: 0 0 10px var(--red-glow);
    }
    .form-group input::placeholder { color: #555; }
    .auth-btn {
      width: 100%;
      background: var(--red);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 4px;
      padding: .85rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: .25s;
      box-shadow: 0 0 18px var(--red-glow);
      margin-top: .5rem;
    }
    .auth-btn:hover { background: var(--red-dark); transform: translateY(-2px); }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--gray);
      font-size: .9rem;
    }
    .auth-footer a { color: var(--red); text-decoration: none; font-weight: 700; }
    .auth-footer a:hover { text-decoration: underline; }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>CAR<span>S</span>TOONS</h1>
    <nav>
      <ul>
        <li><a href="index.html">INICIO</a></li>
        <li><a href="Cars.html">CARROS</a></li>
        <li><a href="Service.html">SERVICIO</a></li>
        <li><a href="Branches.html">SUCURSALES</a></li>
        <li><a href="About.html">NOSOTROS</a></li>
        <li><a href="Contact.html">CONTACTO</a></li>
        <li><a href="Login.html">INICIAR SESIÓN</a></li>
        <li><a href="Registro.html">REGISTRARSE</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h2>REGISTRARSE</h2>
        <p class="auth-subtitle">Crea tu cuenta CARSTOONS</p>

        <form action="Login.html">
          <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" placeholder="Elige un nombre de usuario" required>
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
          </div>
          <button type="submit" class="auth-btn">CREAR CUENTA</button>
        </form>

        <hr class="divider">

        <div class="auth-footer">
          ¿Ya tienes cuenta? <a href="Login.html">Inicia sesión aquí</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 CARSTOONS — Todos los derechos reservados &nbsp;|&nbsp; Medellín, Colombia</p>
  </footer>

</body>
</html>
